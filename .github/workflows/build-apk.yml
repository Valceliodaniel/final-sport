name: Compilador Central Sportech (Gerador de APK)

on:
  repository_dispatch:
    types: [generate-apk]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código fonte do App Template
        uses: actions/checkout@v4

      - name: 2. Preparar ambiente (Node.js e Java)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 3. Injetar Variáveis do Clube no Código
        run: |
          sed -i "s/ID_INJETADO_PELO_GERADOR/${{ github.event.client_payload.appId }}/g" App.js
          sed -i "s/NOME_INJETADO_PELO_GERADOR/${{ github.event.client_payload.clubName }}/g" App.js
          sed -i "s|URL_INJETADA_PELO_GERADOR|${{ github.event.client_payload.clubUrl }}|g" App.js
          sed -i "s/Sportech Template/${{ github.event.client_payload.clubName }}/g" app.json

      - name: 4. Processar e Injetar o Logotipo do Clube
        run: |
          echo "${{ github.event.client_payload.logoBase64 }}" | base64 --decode > ./assets/club-logo.png

      - name: 5. Instalar Dependências do App
        run: npm install

      - name: 6. Compilar o Arquivo APK (Build Real)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.appId }}-APK
          path: android/app/build/outputs/apk/release/app-release.apk
